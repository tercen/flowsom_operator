[package]
name = "flowsom_operator"
version = "0.1.3"
edition = "2024"
description = "FlowSOM clustering for Tercen (Rust), bit-identical to the R operator it replaces"
# GPL-2.0-only, not "or later": the metaclustering comes from `flowsom`, which is a port of
# ConsensusClusterPlus, and that is GPL version 2 with no upgrade clause. See LICENSING.md.
license = "GPL-2.0-only"

[lib]
name = "flowsom_operator"
path = "src/lib.rs"

[[bin]]
name = "flowsom_operator"
path = "src/main.rs"

[[bin]]
name = "dev"
path = "src/bin/dev.rs"

[dependencies]
anyhow = "1"
thiserror = "1"
tercen-rs = { git = "https://github.com/tercen/tercen-rs", branch = "main" }
# Pinned to a tag, not a branch: the clusters this returns are the operator's output and must
# not move under a rebuild.
flowsom = { git = "https://github.com/tercen/flowsom-rs", tag = "0.1.3" }
tokio = { version = "1.49", features = ["rt-multi-thread", "macros", "time"] }
tonic = "0.14"
futures = "0.3"
rustson = { git = "https://github.com/tercen/rustson", branch = "master" }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tikv-jemallocator = "0.6"
rand = "0.8"
rand_chacha = "0.3"

[dev-dependencies]
tempfile = "3"
serde_json = "1"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"

[profile.dev]
opt-level = 1
